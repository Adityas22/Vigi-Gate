spring:
  application:
    name: vigi-gate
  datasource:
    url: jdbc:postgresql://localhost:5432/vigi_gate
    username: postgres
    password: postgres # Replace with actual password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

cors:
  allowed-origins: "http://localhost:5173"
